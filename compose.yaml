services: 

  postgres:
    image: imresamu/postgis:16-3.4-alpine
    container_name: PostgresDB
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pet-radar
    volumes:
      - postgresdb_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: PetRadarRedis
    ports:
      - "6379:6379"

volumes: 
  postgresdb_data: